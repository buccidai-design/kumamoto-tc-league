<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>試合結果 | 熊本TCリーグ</title>
<style>
  :root { --primary: #1a3a5c; --accent: #c8102e; --gold: #d4af37; --light: #f8f5f0; --dark: #0f1c2e; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: transparent; color: #333; line-height: 1.5; }
  section { padding: 5rem 2rem; background: rgba(248,245,240,0.9); }
  header { background: var(--dark); color: white; padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; }
  .header-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 1.5rem; font-weight: 700; } .logo span { color: var(--gold); }
  nav a { color: white; text-decoration: none; margin-left: 1.5rem; }
  nav a:hover { color: var(--gold); }
  .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem; }
  h2 { text-align: center; color: var(--primary); margin-bottom: 0.3rem; }
  .subtitle { text-align: center; color: #666; margin-bottom: 1.5rem; font-size: 0.9rem; }
  .section-title { font-size: 1.3rem; color: var(--primary); margin: 2rem 0 1rem; padding-left: 0.5rem; border-left: 4px solid var(--accent); }
  
  /* Star Chart - larger, tighter */
  .star-wrap { background: #fff; border-radius: 8px; overflow-x: auto; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }
  .star-table { border-collapse: collapse; font-size: 0.85rem; min-width: 100%; }
  .star-table th, .star-table td { border: 1px solid #ddd; text-align: center; padding: 2px 1px; }
  .star-table th { background: var(--primary); color: white; font-weight: 600; writing-mode: vertical-rl; height: 70px; font-size: 0.7rem; padding: 4px 2px; }
  .star-table th:first-child { writing-mode: horizontal-tb; height: auto; width: 90px; }
  .star-table td:first-child { background: var(--primary); color: white; font-weight: 600; text-align: left; padding: 4px 6px; white-space: nowrap; font-size: 0.75rem; width: 90px; }
  .star-table .diag { background: #eee; color: #aaa; }
  .star-table td { min-width: 48px; height: 48px; vertical-align: middle; padding: 1px; }
  .score-line { font-size: 0.65rem; display: block; line-height: 1.1; font-weight: 700; color: #333; }
  .symbol-line { font-size: 1.15rem; display: block; line-height: 1; font-weight: bold; margin-top: 1px; }
  .diag { background: #d1d5db !important; color: #6b7280; font-size: 1rem; }
  
  /* Match Cards - alternating by date */
  .match-card {
    border-radius: 8px;
    padding: 0.7rem 1rem;
    margin-bottom: 0.4rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .match-card.bg1 { background: #ffffff; }
  .match-card.bg2 { background: #f3f4f6; }
  .match-date { font-size: 0.8rem; color: #666; min-width: 80px; }
  .match-teams { flex: 1; font-weight: 600; text-align: center; }
  .match-score { font-size: 1.25rem; font-weight: bold; color: var(--primary); min-width: 60px; text-align: right; }
  .match-note { font-size: 0.7rem; color: #c8102e; width: 100%; text-align: center; }
  .forfeit { border-left: 3px solid #c8102e; }
  .btn { display: inline-block; background: var(--accent); color: white; padding: 0.7rem 1.8rem; border-radius: 8px; text-decoration: none; margin-top: 1.5rem; }
  #loading { text-align: center; padding: 2rem; color: #666; }
  footer { background: var(--dark); color: #aaa; text-align: center; padding: 1.5rem; font-size: 0.85rem; margin-top: 2rem; }
  .legend { display: flex; justify-content: center; gap: 1.5rem; margin: 0.8rem 0 1.5rem; font-size: 0.8rem; }
  .legend span { display: flex; align-items: center; gap: 0.3rem; }
  .legend i { display: inline-block; width: 16px; height: 16px; border-radius: 3px; }
</style>
</head>
<body>

<!-- 背景動画 -->
<video id="bg-video" autoplay muted loop playsinline style="position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:-2;">
  <source src="results_bg.mp4" type="video/mp4">
</video>
<div style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,28,46,0.6); z-index:-1;"></div>

<header>
  <div class="header-inner">
    <div class="logo">熊本<span>TC</span>リーグ</div>
    <nav>
      <a href="index.html">ホーム</a>
      <a href="results.html">試合結果</a>
      <a href="standings.html">順位表</a>
    </nav>
  </div>
</header>

<section>
  <div class="container">
    <h2>試合結果・星取表</h2>
    <p class="subtitle">2026年度</p>
    
    <div id="loading">読み込み中...</div>
    <div id="content" style="display:none;">
      <h3 class="section-title">星取表</h3>
      <div class="legend">
        <span><i style="background:#dcfce7;"></i> ○ 勝ち</span>
        <span><i style="background:#fee2e2;"></i> ● 負け</span>
        <span><i style="background:#fef9c3;"></i> △ 引き分け</span>
        <span><i style="background:#fecaca;"></i> 不 不戦敗</span>
      </div>
      <div class="star-wrap" id="star-chart"></div>
      
      <h3 class="section-title">試合結果（新しい順）</h3>
      <div id="matches"></div>
    </div>
    <p style="text-align:center;"><a href="index.html" class="btn">トップページに戻る</a></p>
  </div>
</section>

<footer>© 2026 熊本TCリーグ</footer>

<script>
const STAR_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTwrC69Dx14x-sBLSlvg-2rPIaUIhiUVAxATe0hwLHkS_7-cV-8aTPAI3pqoxtz5g/pub?gid=986954126&single=true&output=csv';
const MATCH_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTwrC69Dx14x-sBLSlvg-2rPIaUIhiUVAxATe0hwLHkS_7-cV-8aTPAI3pqoxtz5g/pub?gid=1671521405&single=true&output=csv';

async function loadAll() {
  try {
    const [starRes, matchRes] = await Promise.all([fetch(STAR_URL), fetch(MATCH_URL)]);
    const starText = await starRes.text();
    const matchText = await matchRes.text();
    
    // Parse star chart properly (handle quoted multiline cells)
    const starLines = starText.trim().split('\n');
    const headerLine = starLines.find(l => l.includes('TOLUCKY') && l.includes('CHASERS'));
    const teams = headerLine.split(',').slice(1).map(t => t.replace(/"/g, '').trim()).filter(t => t && t.length > 1);
    
    // Better CSV parse for multiline
    function parseCSVLine(text) {
      const rows = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') { inQuotes = !inQuotes; }
        else if (c === '\n' && !inQuotes) { rows.push(current); current = ''; }
        else { current += c; }
      }
      if (current) rows.push(current);
      return rows.map(row => {
        const cols = [];
        let col = '';
        let q = false;
        for (let i = 0; i < row.length; i++) {
          const c = row[i];
          if (c === '"') { q = !q; }
          else if (c === ',' && !q) { cols.push(col.trim()); col = ''; }
          else { col += c; }
        }
        cols.push(col.trim());
        return cols;
      });
    }
    const parsedRows = parseCSVLine(starText);
    
    let starHtml = '<table class="star-table"><thead><tr><th>チーム</th>';
    teams.forEach(t => starHtml += `<th>${t}</th>`);
    starHtml += '</tr></thead><tbody>';
    
    parsedRows.forEach(cols => {
      const team = cols[0];
      if (!teams.includes(team)) return;
      const teamIdx = teams.indexOf(team);
      
      starHtml += `<tr><td>${team}</td>`;
      for (let i = 0; i < teams.length; i++) {
        if (i === teamIdx) {
          starHtml += '<td class="diag">—</td>';
          continue;
        }
        const cell = (cols[i + 1] || '').replace(/\n/g, ' ').trim();
        if (!cell || cell === '—' || cell === '-') {
          starHtml += '<td></td>';
        } else if (cell.includes('○')) {
          const score = cell.replace('○', '').trim();
          starHtml += `<td class="cell-win"><span class="score-line">${score}</span><span class="symbol-line">○</span></td>`;
        } else if (cell.includes('●')) {
          const score = cell.replace('●', '').trim();
          starHtml += `<td class="cell-lose"><span class="score-line">${score}</span><span class="symbol-line">●</span></td>`;
        } else if (cell.includes('△')) {
          const score = cell.replace('△', '').trim();
          starHtml += `<td class="cell-draw"><span class="score-line">${score}</span><span class="symbol-line">△</span></td>`;
        } else if (cell.includes('不')) {
          starHtml += `<td class="cell-forfeit"><span class="score-line">不戦</span><span class="symbol-line">不</span></td>`;
        } else {
          starHtml += `<td><span class="score-line">${cell}</span></td>`;
        }
      }
      starHtml += '</tr>';
    });
    starHtml += '</tbody></table>';
    document.getElementById('star-chart').innerHTML = starHtml;
    
    // Parse matches and sort by date descending
    const matchLines = matchText.trim().split('\n').slice(1);
    const matches = [];
    matchLines.forEach(line => {
      const cols = line.split(',').map(c => c.replace(/^"|"$/g, '').trim());
      const [date, home, away, hs, as_, forfeit, note] = cols;
      if (!date || !home || !away || hs === '' || as_ === '') return;
      matches.push({ date, home, away, hs: parseInt(hs)||0, as: parseInt(as_)||0, forfeit, note });
    });
    matches.sort((a, b) => b.date.localeCompare(a.date));
    
    let matchHtml = '';
    let lastDate = '';
    let colorIdx = 0;
    matches.forEach(m => {
      if (m.date !== lastDate) {
        colorIdx = 1 - colorIdx;
        lastDate = m.date;
      }
      const bgClass = colorIdx === 0 ? 'bg1' : 'bg2';
      const isForfeit = m.forfeit && m.forfeit.length > 0;
      matchHtml += `<div class="match-card ${bgClass}${isForfeit ? ' forfeit' : ''}">
        <div class="match-date">${m.date}</div>
        <div class="match-teams">${m.home} <span style="color:#999;font-weight:400;">vs</span> ${m.away}</div>
        <div class="match-score">${m.hs} - ${m.as}</div>
        ${isForfeit ? `<div class="match-note">不戦敗（${m.forfeit}）</div>` : ''}
      </div>`;
    });
    document.getElementById('matches').innerHTML = matchHtml || '<p style="text-align:center;color:#666;">試合結果がありません</p>';
    
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  } catch (e) {
    document.getElementById('loading').textContent = 'データの読み込みに失敗しました';
  }
}
loadAll();
</script>
</body>
</html>
