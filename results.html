<!DOCTYPE html>

<title>試合結果 | 熊本TCリーグ</title>
<style>
  :root {
    --primary: #1a3a5c;
    --accent: #c8102e;
    --gold: #d4af37;
    --light: #f8f5f0;
    --dark: #0f1c2e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    color: #333;
    background: var(--light);
    line-height: 1.7;
  }
  header {
    background: var(--dark);
    color: white;
    padding: 1rem 2rem;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo { font-size: 1.5rem; font-weight: 700; letter-spacing: 2px; }
  .logo span { color: var(--gold); }
  nav a {
    color: white;
    text-decoration: none;
    margin-left: 1.5rem;
    font-size: 0.95rem;
  }
  nav a:hover { color: var(--gold); }
  .container { max-width: 900px; margin: 0 auto; padding: 3rem 1.5rem; }
  h2 { font-size: 2rem; color: var(--primary); margin-bottom: 0.5rem; text-align: center; }
  .subtitle { text-align: center; color: #666; margin-bottom: 2rem; }
  .btn {
    display: inline-block;
    background: var(--accent);
    color: white;
    padding: 0.8rem 2rem;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
  }
  footer {
    background: var(--dark);
    color: #aaa;
    text-align: center;
    padding: 2rem;
    font-size: 0.9rem;
  }
  footer a { color: var(--gold); text-decoration: none; }
</style>
</head>
