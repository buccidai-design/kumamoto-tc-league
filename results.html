<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>試合結果 | 熊本TCリーグ</title>
<style>
  :root { --primary: #1a3a5c; --accent: #c8102e; --gold: #d4af37; --light: #f8f5f0; --dark: #0f1c2e; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: var(--light); color: #333; line-height: 1.6; }
  header { background: var(--dark); color: white; padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; }
  .header-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 1.5rem; font-weight: 700; } .logo span { color: var(--gold); }
  nav a { color: white; text-decoration: none; margin-left: 1.5rem; }
  nav a:hover { color: var(--gold); }
  .container { max-width: 800px; margin: 0 auto; padding: 2.5rem 1rem; }
  h2 { text-align: center; color: var(--primary); margin-bottom: 0.3rem; }
  .subtitle { text-align: center; color: #666; margin-bottom: 2rem; font-size: 0.95rem; }
  .match-card {
    background: #fff;
    border-radius: 12px;
    padding: 1rem 1.2rem;
    margin-bottom: 0.8rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .match-date { font-size: 0.85rem; color: #888; min-width: 90px; }
  .match-teams { flex: 1; font-weight: 600; text-align: center; }
  .match-score { font-size: 1.4rem; font-weight: bold; color: var(--primary); min-width: 70px; text-align: right; }
  .match-note { font-size: 0.75rem; color: #c8102e; width: 100%; text-align: center; margin-top: 0.3rem; }
  .win { color: #16a34a; }
  .lose { color: #dc2626; }
  .draw { color: #ca8a04; }
  .forfeit { background: #fef2f2; border-left: 3px solid #c8102e; }
  .btn { display: inline-block; background: var(--accent); color: white; padding: 0.7rem 1.8rem; border-radius: 8px; text-decoration: none; margin-top: 1.5rem; }
  #loading { text-align: center; padding: 3rem; color: #666; }
  footer { background: var(--dark); color: #aaa; text-align: center; padding: 1.5rem; font-size: 0.85rem; margin-top: 2rem; }
  .tabs { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem; }
  .tab { padding: 0.5rem 1.2rem; border-radius: 20px; background: #e5e7eb; cursor: pointer; font-size: 0.9rem; }
  .tab.active { background: var(--primary); color: white; }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">熊本<span>TC</span>リーグ</div>
    <nav>
      <a href="index.html">ホーム</a>
      <a href="results.html">試合結果</a>
      <a href="standings.html">順位表</a>
    </nav>
  </div>
</header>

<section>
  <div class="container">
    <h2>試合結果</h2>
    <p class="subtitle">2026年度</p>
    <div id="loading">読み込み中...</div>
    <div id="matches"></div>
    <p style="text-align:center;"><a href="index.html" class="btn">トップページに戻る</a></p>
  </div>
</section>

<footer>© 2026 熊本TCリーグ</footer>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTwrC69Dx14x-sBLSlvg-2rPIaUIhiUVAxATe0hwLHkS_7-cV-8aTPAI3pqoxtz5g/pub?gid=1671521405&single=true&output=csv';

async function loadResults() {
  try {
    const res = await fetch(CSV_URL);
    const text = await res.text();
    const rows = text.trim().split('\n').slice(1); // skip header
    
    let html = '';
    rows.forEach(line => {
      const cols = line.split(',').map(c => c.replace(/^"|"$/g, '').trim());
      const [date, home, away, homeScore, awayScore, forfeit, note] = cols;
      if (!date || !home || !away || homeScore === '' || awayScore === '') return;
      
      const hs = parseInt(homeScore) || 0;
      const as = parseInt(awayScore) || 0;
      const isForfeit = forfeit && forfeit.length > 0;
      
      let scoreClass = '';
      if (!isForfeit) {
        if (hs > as) scoreClass = 'win';
        else if (hs < as) scoreClass = 'lose';
        else scoreClass = 'draw';
      }
      
      html += `<div class="match-card${isForfeit ? ' forfeit' : ''}">
        <div class="match-date">${date}</div>
        <div class="match-teams">${home} <span style="color:#999; font-weight:400;">vs</span> ${away}</div>
        <div class="match-score ${scoreClass}">${hs} - ${as}</div>
        ${isForfeit ? `<div class="match-note">不戦敗（${forfeit}）</div>` : ''}
        ${note && !isForfeit ? `<div class="match-note">${note}</div>` : ''}
      </div>`;
    });
    
    document.getElementById('matches').innerHTML = html || '<p style="text-align:center; color:#666;">試合結果がありません</p>';
    document.getElementById('loading').style.display = 'none';
  } catch (e) {
    document.getElementById('loading').textContent = 'データの読み込みに失敗しました';
  }
}
loadResults();
</script>
</body>
</html>
