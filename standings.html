<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>順位表 | 熊本TCリーグ</title>
<style>
  :root { --primary: #1a3a5c; --accent: #c8102e; --gold: #d4af37; --light: #f8f5f0; --dark: #0f1c2e; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: transparent; color: #333; line-height: 1.6; }
  section { padding: 5rem 2rem; background: rgba(248,245,240,0.75); }
  header { background: var(--dark); color: white; padding: 1rem 2rem; position: sticky; top: 0; z-index: 100; }
  .header-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 1.5rem; font-weight: 700; } .logo span { color: var(--gold); }
  nav a { color: white; text-decoration: none; margin-left: 1.5rem; }
  nav a:hover { color: var(--gold); }
  .container { max-width: 900px; margin: 0 auto; padding: 2.5rem 1rem; }
  h2 { text-align: center; color: var(--primary); margin-bottom: 0.3rem; }
  .subtitle { text-align: center; color: #666; margin-bottom: 2rem; font-size: 0.95rem; }
  .table-wrap { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
  table { width: 100%; border-collapse: collapse; }
  th { background: var(--primary); color: white; padding: 0.9rem 0.5rem; font-weight: 600; font-size: 0.85rem; }
  td { padding: 0.8rem 0.5rem; text-align: center; border-bottom: 1px solid #f0f0f0; }
  tr:nth-child(even) { background: #fafafa; }
  tr:hover { background: #f0f7ff; }
  .rank { font-weight: bold; font-size: 1.1rem; }
  .rank-1 { color: #d4af37; }
  .rank-2 { color: #9ca3af; }
  .rank-3 { color: #b45309; }
  .team-name { text-align: left; padding-left: 1rem; font-weight: 600; }
  .points { font-weight: bold; color: var(--primary); font-size: 1.1rem; }
  .positive { color: #16a34a; }
  .negative { color: #dc2626; }
  .btn { display: inline-block; background: var(--accent); color: white; padding: 0.7rem 1.8rem; border-radius: 8px; text-decoration: none; margin-top: 1.5rem; }
  #loading { text-align: center; padding: 3rem; color: #666; }
  footer { background: var(--dark); color: #aaa; text-align: center; padding: 1.5rem; font-size: 0.85rem; margin-top: 2rem; }
  @media (max-width: 600px) {
    th, td { padding: 0.5rem 0.3rem; font-size: 0.8rem; }
    .team-name { padding-left: 0.5rem; }
  }
</style>
</head>
<body>

<!-- 背景動画 -->
<video id="bg-video" autoplay muted loop playsinline style="position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:-2;">
  <source src="standings_bg.mp4" type="video/mp4">
</video>
<div style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,28,46,0.15); z-index:-1;"></div>

<header>
  <div class="header-inner">
    <div class="logo">熊本<span>TC</span>リーグ</div>
    <nav>
      <a href="index.html">ホーム</a>
      <a href="results.html">試合結果</a>
      <a href="standings.html">順位表</a>
    </nav>
  </div>
</header>

<section>
  <div class="container">
    <h2>2026年度 順位表</h2>
    <p class="subtitle">勝ち点 → 得失点差 で自動計算</p>
    <div id="loading">読み込み中...</div>
    <div class="table-wrap" id="table-container" style="display:none;"></div>
    <p style="text-align:center;"><a href="index.html" class="btn">トップページに戻る</a></p>
  </div>
</section>

<footer>© 2026 熊本TCリーグ</footer>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTwrC69Dx14x-sBLSlvg-2rPIaUIhiUVAxATe0hwLHkS_7-cV-8aTPAI3pqoxtz5g/pub?gid=68756592&single=true&output=csv';

async function loadStandings() {
  try {
    const res = await fetch(CSV_URL);
    const text = await res.text();
    const lines = text.trim().split('\n');
    
    // Find the sorted section (second table starting with 順位,チーム)
    let startIdx = -1;
    let count = 0;
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].startsWith('順位,チーム')) {
        count++;
        if (count === 2) { startIdx = i + 1; break; }
      }
    }
    if (startIdx === -1) startIdx = 3; // fallback
    
    let html = `<table>
      <thead><tr>
        <th>順位</th><th>チーム</th><th>試合</th><th>勝</th><th>負</th><th>分</th><th>勝ち点</th><th>得失点差</th>
      </tr></thead><tbody>`;
    
    for (let i = startIdx; i < lines.length; i++) {
      const cols = lines[i].split(',').map(c => c.replace(/^"|"$/g, '').trim());
      const rank = cols[0];
      const team = cols[1];
      if (!rank || !team || isNaN(parseInt(rank))) continue;
      
      const games = cols[2] || '-';
      const wins = cols[3] || '-';
      const losses = cols[4] || '-';
      const draws = cols[5] || '-';
      const points = cols[6] || '-';
      const diff = cols[9] || '0';
      const diffNum = parseInt(diff) || 0;
      const diffClass = diffNum > 0 ? 'positive' : (diffNum < 0 ? 'negative' : '');
      const rankClass = rank <= 3 ? `rank-${rank}` : '';
      
      html += `<tr>
        <td class="rank ${rankClass}">${rank}</td>
        <td class="team-name">${team}</td>
        <td>${games}</td>
        <td>${wins}</td>
        <td>${losses}</td>
        <td>${draws}</td>
        <td class="points">${points}</td>
        <td class="${diffClass}">${diffNum > 0 ? '+' : ''}${diff}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    
    document.getElementById('table-container').innerHTML = html;
    document.getElementById('table-container').style.display = 'block';
    document.getElementById('loading').style.display = 'none';
  } catch (e) {
    document.getElementById('loading').textContent = 'データの読み込みに失敗しました';
  }
}
loadStandings();
</script>
</body>
</html>
